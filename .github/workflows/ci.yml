name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  jakosc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-uv nie ma tagu v10, trzeba podać pełną wersję
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run mypy
      - run: uv run pytest
      - run: uv run --group docs zensical build
      - run: uv build
