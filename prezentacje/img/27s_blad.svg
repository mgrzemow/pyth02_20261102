<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" font-family="Segoe UI, system-ui, sans-serif">
  <!-- jeden błąd w TaskGroup anuluje pozostałe zadania -->
  <defs><marker id="grot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#306998"/></marker></defs>
  <text x="10" y="58" font-size="22" fill="#1c2330" text-anchor="start" font-weight="700" font-family="Consolas, monospace">A</text>
  <rect x="90" y="30" width="220.0" height="44" rx="5" fill="#dfe4ec" stroke="none" />
  <text x="322.0" y="59" font-size="19" fill="#1a7f37" text-anchor="start" font-weight="700">koniec A</text>
  <text x="10" y="128" font-size="22" fill="#1c2330" text-anchor="start" font-weight="700" font-family="Consolas, monospace">B</text>
  <rect x="90" y="100" width="440.0" height="44" rx="5" fill="#dfe4ec" stroke="none" />
  <rect x="516.0" y="100" width="14" height="44" rx="5" fill="#c62828" stroke="none" />
  <text x="542.0" y="129" font-size="19" fill="#c62828" text-anchor="start" font-weight="700">ValueError</text>
  <text x="10" y="198" font-size="22" fill="#1c2330" text-anchor="start" font-weight="700" font-family="Consolas, monospace">C</text>
  <rect x="90" y="170" width="440.0" height="44" rx="5" fill="#dfe4ec" stroke="none" />
  <rect x="530.0" y="170" width="220.0" height="44" rx="5" fill="#fff" stroke="#b8c0cc" stroke-dasharray="6 5"/>
  <text x="640.0" y="199" font-size="18" fill="#68717f" text-anchor="middle" font-weight="400">anulowane</text>
  <line x1="530.0" y1="20" x2="530.0" y2="235" stroke="#c62828" stroke-width="3" stroke-dasharray="7 5"/>
  <text x="530.0" y="262" font-size="18" fill="#c62828" text-anchor="middle" font-weight="700">TaskGroup anuluje C</text>
  <line x1="90" y1="290" x2="750.0" y2="290" stroke="#68717f" stroke-width="2" />
  <line x1="90" y1="285" x2="90" y2="295" stroke="#68717f" stroke-width="2" />
  <text x="90" y="316" font-size="18" fill="#68717f" text-anchor="middle" font-weight="400">0 s</text>
  <line x1="310.0" y1="285" x2="310.0" y2="295" stroke="#68717f" stroke-width="2" />
  <text x="310.0" y="316" font-size="18" fill="#68717f" text-anchor="middle" font-weight="400">0,1 s</text>
  <line x1="530.0" y1="285" x2="530.0" y2="295" stroke="#68717f" stroke-width="2" />
  <text x="530.0" y="316" font-size="18" fill="#68717f" text-anchor="middle" font-weight="400">0,2 s</text>
  <line x1="750.0" y1="285" x2="750.0" y2="295" stroke="#68717f" stroke-width="2" />
  <text x="750.0" y="316" font-size="18" fill="#68717f" text-anchor="middle" font-weight="400">0,3 s</text>
  <text x="450" y="355" font-size="19" fill="#1c2330" text-anchor="middle" font-weight="400">C dostaje CancelledError na await, wykonuje finally, a potem leci ExceptionGroup.</text>
</svg>
